name: Prüfung

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"   # montags: findet Brüche durch Änderungen in nixpkgs (vor allem unstable)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax und shellcheck
        run: |
          bash -n install.sh && bash -n build-iso.sh && bash -n tests/eval.sh
          shellcheck -S warning install.sh build-iso.sh tests/eval.sh

  auswertung:
    name: Auswertung (${{ matrix.kanal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kanal: [release, unstable]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Erzeugte Konfigurationen gegen NixOS auswerten
        run: tests/eval.sh ${{ matrix.kanal }}
